name: Publish Nightly

# Rewrites the rolling pre-release: every asset is uploaded with --clobber,
# so download URLs stay stable. `targets` filters the binary matrix by label
# substring (`cuda`, `macos`, `x86_64-linux-vulkan`, ...); the targets
# themselves are defined in ci/ci.toml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update
        type: string
        default: nightly
      targets:
        description: Binary targets to build (comma-separated label substrings; `all`; `none`)
        type: string
        default: all
      languages:
        description: Build pie-language-python.tar.gz and pie-language-javascript.tar.gz
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - run: bash ci/lib/release.sh ensure "${{ inputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The targets live in ci/ci.toml under [[release.binary]].
      - id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: python3 ci/ci.py release binaries --targets "$TARGETS"

  binaries:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    name: ${{ matrix.target.label }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    container: ${{ matrix.target.container }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
        with:
          triple: ${{ matrix.target.triple }}
          features: ${{ matrix.target.features }}
          manylinux: ${{ matrix.target.container && 'true' || 'false' }}
          cache-key: build-${{ matrix.target.label }}
      - shell: bash
        run: cargo build --profile release-min --target ${{ matrix.target.triple }} -p pie --features ${{ matrix.target.features }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bin="${CARGO_TARGET_DIR:-target}/${{ matrix.target.triple }}/release-min"
          if [[ "$RUNNER_OS" == Windows ]]; then
            asset="pie-${{ matrix.target.label }}.zip"; 7z a "$asset" "$bin/pie.exe"
          else
            asset="pie-${{ matrix.target.label }}.tar.gz"; tar -C "$bin" -czf "$asset" pie
          fi
          ls -la "$asset"
          bash ci/lib/release.sh upload "${{ inputs.tag }}" "$asset"

  # Pure wasm: one asset per language serves every platform. install.sh
  # extracts them into PIE_HOME; the built-in inferlets need none, being
  # in the binary.
  languages:
    needs: plan
    if: inputs.languages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv tool install componentize-py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: bash scripts/build-languages.sh target/languages
      - run: bash ci/lib/release.sh upload "${{ inputs.tag }}" target/languages/pie-language-python.tar.gz target/languages/pie-language-javascript.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notes:
    needs: [binaries, languages]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash ci/lib/release.sh ensure "${{ inputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
