name: CI

# What runs where is defined in `ci/ci.toml`, not here. This workflow only
# turns that file into jobs: `plan` reads it, `required` runs every blocking
# leg in parallel, `advisory` runs the non-blocking ones, and `ci-ok` is the
# single status check that branch protection requires.
#
# A PR runs the `pr` level. The merge queue and pushes to main add `queue`,
# so a change is tested on top of the current main before it lands. The
# nightly schedule adds `nightly`. Run any check locally with
# `python3 ci/ci.py run <check>`; see `ci/README.md`.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      level:
        description: Level to run
        type: choice
        options: [pr, queue, nightly]
        default: nightly

# A new push to a PR cancels that PR's previous run. Main, the merge queue
# and the nightly always finish, so every commit on main has a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.plan.outputs.required }}
      advisory: ${{ steps.plan.outputs.advisory }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ci
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          LEVEL: ${{ inputs.level }}
        run: python3 ci/ci.py plan "$EVENT" --labels "$LABELS" ${LEVEL:+--level "$LEVEL"}

  required:
    needs: plan
    if: needs.plan.outputs.required != '[]'
    uses: ./.github/workflows/checks.yml
    with:
      legs: ${{ needs.plan.outputs.required }}

  advisory:
    needs: plan
    if: needs.plan.outputs.advisory != '[]'
    uses: ./.github/workflows/checks.yml
    with:
      legs: ${{ needs.plan.outputs.advisory }}
      advisory: true

  # The one required status check. It runs even when a leg failed, so a red
  # leg can never be mistaken for a missing one.
  ci-ok:
    if: always()
    needs: [plan, required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          REQUIRED: ${{ needs.required.result }}
          LEGS: ${{ needs.plan.outputs.required }}
        run: |
          echo "plan: $PLAN, required legs: $REQUIRED"
          [ "$PLAN" = success ] || { echo "::error::the plan job did not succeed"; exit 1; }
          [ "$LEGS" = '[]' ] && exit 0
          [ "$REQUIRED" = success ] || { echo "::error::a required leg did not pass"; exit 1; }
