version: 2

# One grouped PR per ecosystem per week instead of one per package. Major
# versions still get their own PR, since they are the ones that break.

updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directories:
      - "/python/client"
      - "/python/inferlet"
      - "/python/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip:
        update-types: ["minor", "patch"]

  # The npm workspace: one lockfile for client, inferlet, browser and server.
  - package-ecosystem: "npm"
    directory: "/javascript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        update-types: ["minor", "patch"]

  # The workflows and the composite action they share. Actions are pinned to
  # a commit with the version in a comment; dependabot keeps both current.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
